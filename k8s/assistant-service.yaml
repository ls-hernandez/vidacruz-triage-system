apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  # 1 replica: the RF-06 SSE alerts come from the Kafka listener, so with several replicas each pod would only alert
  # its own clients about the escalations of its own partitions (ADR-004, docs/assumptions.md 40). The Redis view
  # (RF-04 B) and the RAG (RF-04 A) would scale fine. A rolling update briefly runs 2 pods; SSE clients reconnect.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # The image user "app" is not numeric, so the kubelet needs its UID/GID to enforce runAsNonRoot
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: assistant-service
          # Placeholder; the real <acr-name>.azurecr.io/vidacruz/assistant-service:<tag> is set in kustomization.yaml
          image: assistant-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: vidacruz-config
          env:
            # Only the secrets this service needs (not the whole Secret)
            - name: ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: ASSISTANT_API_KEY
            # Optional: without it the yml default "not-configured" applies, the service starts and the RAG answers
            # 503. It must never be an empty value (Spring AI rejects it at startup, docs/assumptions.md 1).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: KAFKA_SASL_JAAS_CONFIG
                  optional: true
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: REDIS_PASSWORD
                  optional: true
          # Memory request = limit: the image sets -XX:MaxRAMPercentage=75, so the heap is ~576 MB of this limit
          # (7 corpus fragments in memory: the in-memory vector store needs little).
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 768Mi
          # Up to 3 minutes to start. The corpus ingestion runs in the background and never delays startup.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Ready only while Redis answers; never depends on the LLM, the RAG index or Kafka
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable /tmp for the JVM (hsperfdata) and Netty native libraries; the rest is read-only
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: assistant-service
  ports:
    - name: http
      port: 8081
      targetPort: http

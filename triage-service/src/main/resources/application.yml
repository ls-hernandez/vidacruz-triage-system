spring:
  application:
    name: triage-service
  config:
    # Local convenience: load the root .env (KEY=VALUE) when running from the repo root or from the module
    # directory (IDE / spring-boot:run). Real environment variables always take precedence.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:triage}
    username: ${POSTGRES_USER:triage}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # Flyway uses its own JDBC connection at startup; the application itself only uses R2DBC
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:triage}
    user: ${POSTGRES_USER:triage}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Events are serialized to JSON by the publisher: no Java type headers on the wire
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Bound how long a registration waits when Kafka is down (defaults: 60 s blocking + 120 s delivery)
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jackson:
    # Strict JSON input: 72.5 or "72" in an integer field is a 400, not a silent 72
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

triage:
  # SLA per level in minutes (RN-02); captured on each patient at registration
  # Overridable by environment (e.g. TRIAGE_SLA_CRITICAL=1) to test the escalation without waiting
  sla:
    critical: ${TRIAGE_SLA_CRITICAL:5}
    urgent: ${TRIAGE_SLA_URGENT:10}
    urgent-2: ${TRIAGE_SLA_URGENT_2:30}
    non-urgent: ${TRIAGE_SLA_NON_URGENT:60}
    non-urgent-2: ${TRIAGE_SLA_NON_URGENT_2:120}
  # RF-03: background SLA escalation
  escalation:
    enabled: ${TRIAGE_ESCALATION_ENABLED:true}
    # Delay between the end of one cycle and the start of the next (ISO 8601)
    interval: ${TRIAGE_ESCALATION_INTERVAL:PT30S}
    # Patients escalated in parallel per cycle; below the R2DBC pool size (10 by default)
    concurrency: 4
  events:
    topic: triaje.eventos
    partitions: 3
    replicas: 1

server:
  port: ${TRIAGE_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

name: vidacruz

# Whole system: docker compose up --build   (infrastructure only: docker compose up -d postgres kafka redis)
# Variables come from .env (copy .env.example); no secret is written in this file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triage}
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      # Single-node KRaft cluster (broker + controller, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:19092). HOST: the developer machine (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- application services --------------------------------------------------------------------------------------
  # Inside the compose network every dependency is reached on its internal port (postgres:5432, kafka:19092,
  # redis:6379); the *_PORT variables of .env are only the ports published to the host. Images skip the tests:
  # run ./mvnw verify (needs Docker for Testcontainers) before building.
  triage-service:
    build:
      context: .
      dockerfile: triage-service/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-triage}
      POSTGRES_USER: ${POSTGRES_USER:-triage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy .env.example to .env)}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRIAGE_SERVER_PORT: "8080"
      TRIAGE_API_KEY: ${TRIAGE_API_KEY:?TRIAGE_API_KEY is required (copy .env.example to .env)}
      # No SPRING_PROFILES_ACTIVE: default profile, JSON (ECS) logs with traceId/spanId
    ports:
      - "${TRIAGE_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # Public readiness probe (UP only while PostgreSQL answers); busybox wget is in the alpine runtime image
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # Real limit for -XX:MaxRAMPercentage=75 (set in the image)
    mem_limit: 768m
    restart: unless-stopped

  assistant-service:
    build:
      context: .
      dockerfile: assistant-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASSISTANT_SERVER_PORT: "8081"
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:?ASSISTANT_API_KEY is required (copy .env.example to .env)}
      # ":-" also turns an empty value into the placeholder: Spring AI rejects an empty key (assumption 1).
      # Without a real key the service starts and the clinical queries answer 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
    ports:
      - "${ASSISTANT_SERVER_PORT:-8081}:8081"
    # Not on triage-service: the services only talk through Kafka (it waits for the topic if it starts first)
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Public readiness probe (UP only while Redis answers; never depends on the LLM)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    restart: unless-stopped

volumes:
  postgres-data:

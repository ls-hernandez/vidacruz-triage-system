# Tests never call OpenAI: the chat and embedding models are replaced by the doubles of FakeAiConfiguration.
spring.ai.model.chat=none
spring.ai.model.embedding=none

# Threshold for the keyword-based test embeddings (not comparable to the real OpenAI similarities)
assistant.rag.similarity-threshold=0.3
assistant.rag.ingestion.retry-interval=PT0.5S

# Small, fast resilience settings so the circuit breaker and the time limit can be exercised quickly
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s
resilience4j.timelimiter.instances.embedding.timeout-duration=500ms
resilience4j.timelimiter.instances.chat.timeout-duration=500ms
